<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteo - Weather App</title>
    
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body class="bg-primary-subtle min-vh-100">
    <header class="py-4 text-center shadow-sm">
      <h1 class="fw-bold mt-2 mb-4">A Simple Weather App</h1>
      <form id="searchForm">
        <div class="d-flex justify-content-center mb-3">
          <input
            autofocus
            autocomplete="off"
            class="form-control w-auto d-inline rounded-end-0 rounded-pill px-4 fs-4 shadow-none"
            type="text"
            id="searchInput"
            placeholder="Search for a city..."
            required
          />
          <button
            type="submit"
            class="btn btn-primary rounded-start-0 rounded-pill px-4 py-2 d-flex align-items-center"
            aria-label="Search city"
          >
            <i class="bi bi-search fs-5"></i>
          </button>
        </div>
      </form>
      <div class="error text-danger fw-semibold mt-2"></div>
    </header>

    <main
      id="main"
      class="d-flex justify-content-center align-items-stretch gap-4 flex-wrap px-3 py-5"
    ></main>

    <!-- HTML Template for dynamic weather cards -->
    <template id="cardTemplate">
      <div class="card rounded-4 ps-4 pe-3 py-4 position-relative shadow-sm" style="width: 22rem;">
        <div class="position-absolute top-0 end-0 m-3 d-flex gap-2">
          <button class="btn btn-sm btn-link text-primary p-0 border-0 refresh-btn" title="Refresh">
            <i class="bi bi-arrow-clockwise fs-4"></i>
          </button>
          <button class="btn btn-sm btn-link text-danger p-0 border-0 remove-btn" title="Remove">
            <i class="bi bi-x-circle fs-4"></i>
          </button>
        </div>

        <h4 style="width: fit-content" class="position-relative mt-2">
          <span class="city fw-bold"></span>
          <span class="country fs-6 position-absolute top-0 start-100 translate-middle rounded-circle px-2 py-1 ms-2 text-bg-primary"></span>
        </h4>

        <div class="d-flex align-items-center mb-3 gap-3 mt-3">
          <h1 class="temp m-0 fw-bold display-4"></h1>
          <div class="d-flex align-items-center gap-2">
            <div class="d-flex flex-column align-items-center">
              <h5 class="temp-max m-0 text-danger fw-bold"></h5>
              <h5 class="temp-min m-0 text-info fw-bold"></h5>
            </div>
            <h5 class="humidity m-0 text-secondary"></h5>
          </div>
        </div>

        <div class="d-flex align-items-center mb-3 gap-2">
          <img class="icon" src="" alt="Weather icon" width="60" height="60" />
          <div class="d-flex flex-column gap-1">
            <h6 class="m-0 text-secondary">
              <i class="bi bi-brightness-high-fill text-warning me-1"></i>
              <span class="sunrise"></span>
            </h6>
            <h6 class="m-0 text-secondary">
              <i class="bi bi-brightness-alt-high-fill text-danger me-1"></i>
              <span class="sunset"></span>
            </h6>
            <h6 class="m-0 text-secondary d-flex align-items-center gap-1">
              <i class="bi bi-wind text-secondary me-1"></i>
              <span class="wind-speed"></span>
              <i class="bi bi-arrow-up wind-direction text-danger ms-1 d-inline-block"></i>
            </h6>
          </div>
        </div>

        <h5 class="description text-capitalize text-body-secondary mt-auto mb-0 fw-semibold"></h5>
      </div>
    </template>
  </body>
</html>
